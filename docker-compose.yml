services:
  postgres:
    image: postgres:16-alpine
    container_name: scorelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scorelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scorelens}
      POSTGRES_DB: scorelens
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scorelens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorelens -d scorelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://scorelens:${POSTGRES_PASSWORD:-scorelens}@postgres:5432/scorelens?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PORT: 3100
      UPLOAD_DIR: /app/data/uploads
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/v1/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:3100
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  scorelens-pgdata:
  uploads:
  caddy_data:
  caddy_config:
